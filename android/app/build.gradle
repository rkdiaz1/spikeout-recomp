plugins { id 'com.android.application' }
android {
    namespace 'org.libsdl.app'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.spikeoutrecomp.android'
        minSdk 33          // execinfo's backtrace() in bionic
        targetSdk 35
        versionCode 3
        versionName '0.1-android-test'
        ndk { abiFilters 'arm64-v8a' }
    }
    // the native libraries are built by CMake in the workflow and copied into src/main/jniLibs;
    // SDL's Java sources are copied there too (from the same SDL release)
    packaging { jniLibs { useLegacyPackaging = true } }
}
